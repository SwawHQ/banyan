{{- if or .meta .toc -}}
<aside id="document-aside" class="document-aside" aria-label="{{ i18n .label }}">
  {{- with .meta -}}<div class="slot slot-meta" data-slot="meta">{{ . | safeHTML }}</div>{{- end -}}
  {{- .toc | safeHTML -}}
</aside>
{{- if .collapsible -}}
  {{- partial "system-assets/script.html" (dict "path" "js/document/aside.js") -}}
{{- end -}}
{{- end -}}
