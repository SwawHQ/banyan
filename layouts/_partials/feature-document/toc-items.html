{{- range . -}}
  {{- if and .ID (in (slice 2 3) .Level) -}}
    {{- $href := printf "#%s" (.ID | urlquery | replaceRE "\\+" "%20") -}}
    <li class="document-toc__h{{ .Level }}">
      <a class="collection-item-link" href="{{ $href }}">
        <span class="collection-item-title">{{ .Title | plainify | htmlUnescape }}</span>
      </a>
    </li>
  {{- end -}}
  {{- partial "feature-document/toc-items.html" .Headings -}}
{{- end -}}
