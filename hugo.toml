# Banyan documentation and demo site.
#
# Sites own their complete configuration. Use this file as a reference.

baseURL = "https://banyan.swaw.com/"
title = "Banyan"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
timeZone = "Asia/Shanghai"
panicOnWarning = true
printPathWarnings = true

[build]
# 禁止 Hugo js.Build 自动写入 assets/jsconfig.json；该文件只服务编辑器跳转，不参与站点构建。
noJSConfigInAssets = true

[minify]
# js.Build owns JS minification; preserve inline bytes used by CSP hashes.
disableJS = true

[cascade.build]
# Page bundle resources should be published only through explicit theme pipelines.
publishResources = false

[params]
description = "Official documentation and release notes for the Banyan Hugo theme."
theme_changelog = "/changelog/"

[params.content_source]
repository = "https://github.com/SwawHQ/banyan"
branch = "main"
content_root = "content"

[params.appearance]
# Complete color-role file, relative to assets/. Select at build time.
# Built-in alternative: "css/theme-monochrome.css" (both light and dark modes).
palette = "css/theme.css"

[params.agent_access]
# robots.txt rules; list specific crawlers when needed.
default_policy = "allow"
allow_user_agents = []
disallow_user_agents = []

[params.media.responsive_images]
# Keep sizes aligned with the readable content width in assets/css/prose-base.css.
# The browser uses sizes, srcset and device DPR to choose a WebP candidate.
sizes = "auto, (max-width: 820px) calc(100vw - 32px), 800px"
widths = [768, 1200, 1600]
# Click-through links still expose the original image.
max_width = 1600

[params.build]
# Shared version format for the Service Worker and update page.
version_prefix = "v"
timestamp_layout = "20060102150405"

[frontmatter]
# Editorial update time: never derive it from repository maintenance.
lastmod = ["lastmod", "date"]

[taxonomies]
# Empty table disables Hugo's default tags and categories.

[markup.highlight]
noClasses = false
[markup.goldmark.renderer]
unsafe = false

[outputs]
page     = ["HTML"]
section  = ["HTML","RSS"]
home     = ["HTML","RSS","LLMS"]

[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[languages]
[languages.en]
label = "English"
locale = "en-US"
weight = 1
[languages.en.params]
icon = { text = "EN" }

[languages.zh]
label = "中文"
locale = "zh-CN"
weight = 2
[languages.zh.params]
description = "Banyan Hugo 主题的官方文档与发布说明。"
theme_changelog = "/zh/changelog/"
icon = { text = "简" }

[languages.zh-tw]
label = "繁體"
locale = "zh-TW"
weight = 3
[languages.zh-tw.params]
description = "Banyan Hugo 主題的官方文件與發佈說明。"
icon = { text = "繁" }

[module.hugoVersion]
min = "0.168.0"

[[module.imports]]
path = "github.com/SwawHQ/banyan/module"
