# Banyan documentation and demo site.
#
# The site selects its identity, languages, outputs, taxonomies and URL rules.
# Module defaults follow Hugo's default configuration merge strategy.

baseURL = "https://banyan.swaw.com/"
languageCode = "en-us"
title = "Banyan"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
timeZone = "Asia/Shanghai"
panicOnWarning = true

[build]
# 禁止 Hugo js.Build 自动写入 assets/jsconfig.json；该文件只服务编辑器跳转，不参与站点构建。
noJSConfigInAssets = true

[minify]
# js.Build owns JS minification; preserve inline bytes used by CSP hashes.
disableJS = true

[cascade.build]
# Page bundle resources should be published only through explicit theme pipelines.
publishResources = false

[params]
description = "Official documentation and release notes for the Banyan Hugo theme."
theme_changelog = "/changelog/"

[params.content_source]
repository = "https://github.com/SwawHQ/banyan"

[frontmatter]
# Editorial update time: never derive it from repository maintenance.
lastmod = ["lastmod", "date"]

[pagination]
pagerSize = 30

[taxonomies]
tag = "tags"
tool = "tools"

[markup.highlight]
noClasses = false
[markup.goldmark.renderer]
unsafe = false

[outputs]
page     = ["HTML"]
section  = ["HTML","RSS"]
home     = ["HTML","RSS","LLMS"]
taxonomy = ["HTML","RSS"]
term     = ["HTML","RSS"]

[languages]
[languages.en]
languageName = "English"
weight = 1

[languages.zh]
languageName = "中文"
weight = 2
[languages.zh.params]
description = "Banyan Hugo 主题的官方文档与发布说明。"
theme_changelog = "/zh/changelog/"

[languages.zh-tw]
languageName = "繁體"
weight = 3
[languages.zh-tw.params]
description = "Banyan Hugo 主題的官方文件與發佈說明。"

[permalinks]
d = "/p/:slug/"

[[module.imports]]
path = "github.com/SwawHQ/banyan/module"
