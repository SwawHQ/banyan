{{- $ctx := . -}}
{{- $roots := partialCached "./pages.html" $ctx $ctx.Language.Lang -}}
{{- $selected := false -}}
{{- range $node := (slice $ctx) | append $ctx.Ancestors -}}
  {{- if in $roots $node -}}
    {{- $selected = $node -}}
    {{- break -}}
  {{- end -}}
{{- end -}}
{{- return $selected -}}
