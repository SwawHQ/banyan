{{- $site := . -}}
{{- $pages := slice -}}
{{- range ($site.Store.Get "banyan.sitemap.pages") -}}
  {{- with $site.GetPage .Path -}}
    {{- if partial "./eligible.html" . -}}
      {{- $pages = $pages | append . -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- return (sort $pages "Permalink") -}}
