{{- if or .meta .toc -}}
<aside id="document-aside" class="page-column document-aside" aria-label="{{ i18n .label }}">
  {{- with .meta -}}<div class="slot slot-meta" data-slot="meta">{{ . | safeHTML }}</div>{{- end -}}
  {{- .toc | safeHTML -}}
  {{- if .collapsible -}}
  <div class="document-tools">
    <button id="document-aside-close" class="item-control" type="button" aria-controls="document-aside"><span class="item-title">{{ i18n "document_aside_close" }}</span></button>
  </div>
  {{- end -}}
</aside>
{{- if .collapsible -}}
  {{- partial "system-assets/script.html" (dict "path" "js/document/aside.js") -}}
{{- end -}}
{{- end -}}
