{{- $items := trim (printf "%s" (partial "./toc-items.html" .Fragments.Headings)) " \r\n\t" -}}
{{- with $items -}}
<nav class="document-toc" aria-label="{{ i18n "document_chapters" }}">
  <ul>
    <li>
      <a class="item-control" href="#main">
        <span class="item-title">{{ i18n "document_chapters" }}</span>
      </a>
    </li>
    {{ . | safeHTML }}
  </ul>
</nav>
{{ partial "system-assets/script.html" (dict "path" "js/document/toc.js") }}
{{- end -}}
