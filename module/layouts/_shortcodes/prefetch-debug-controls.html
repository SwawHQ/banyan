{{- $labels := partial "feature-prefetch-debug/labels.html" .Page -}}
<form id="prefetch-debug-controls" method="get" data-prefetch-debug-copy='{{ $labels | jsonify }}'>
  <label for="prefetch-debug-backend">{{ $labels.backend }}</label>
  <select id="prefetch-debug-backend" name="prefetch-backend">
    {{- range slice "auto" "native" "sw" "link" "off" }}
    <option value="{{ . }}">{{ index $labels . }}</option>
    {{- end }}
  </select>
  <button type="submit">{{ $labels.apply }}</button>
</form>
<p id="prefetch-debug-status" role="status" aria-live="polite">{{ $labels.loading }}</p>
