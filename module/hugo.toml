# Banyan Hugo Module defaults.
# -------------------------------------------------------------------
# Theme Default Configuration
# -------------------------------------------------------------------
# This file provides the baseline properties for the Banyan theme.
# Note: Structural configurations like [outputs], [taxonomies], and
# [permalinks] are intentionally omitted here. Sites must define them in their
# root hugo.toml. Output format definitions are inherited from theme config, but
# sites still need root [outputs] entries to enable those formats.

baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "Banyan Theme"


preserveTaxonomyNames = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
timeZone = "Asia/Shanghai"

panicOnWarning = true

[languages]
[languages.en]
languageName = "English"
weight = 1
[languages.en.params]
locale = "en_US"

[languages.zh]
languageName = "中文"
weight = 2
[languages.zh.params]
locale = "zh_CN"

[languages.zh-tw]
languageName = "繁體"
weight = 3
[languages.zh-tw.params]
locale = "zh_TW"

[outputFormats]
[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[params]
# Shared default; sites may override per language with languages.<lang>.params.
description = "A minimalist theme for Hugo."

[params.content_source]
# Set the site's content repository to enable article source links.
repository = ""
branch = "main"
content_root = "content"

[params.appearance]
# Complete color-role file, relative to assets/. Select at build time.
# Built-in alternative: "css/theme-monochrome.css" (both light and dark modes).
palette = "css/theme.css"

[params.agent_access]
# Banyan defaults to open discovery and model access. Publishers who need a
# different consent policy should override these values in their site config.
# The wildcard policy already covers current and future crawlers; keep the
# explicit lists empty so a site can add exceptions without conflicting groups.
default_policy = "allow"
allow_user_agents = []
disallow_user_agents = []

[params.web_app_manifest]
# link  = emit <link rel="manifest"> in <head> for the most predictable PWA path
# defer = emit the manifest late in <head>, after render-critical styles/scripts
#         have already been discovered
# off   = do not generate or link the web app manifest
mode = "defer"

[params.media.responsive_images]
# Keep this fallback aligned with the readable content width in
# assets/css/prose-base.css. The browser uses sizes with srcset and the
# device DPR to choose a generated WebP candidate.
sizes = "auto, (max-width: 820px) calc(100vw - 32px), 800px"
widths = [768, 1200, 1600]
# Reading pages should not auto-download source-size images; click-through
# links still expose the original file when details matter.
max_width = 1600

[params.build]
# Site-wide build version defaults used by the Service Worker and update page.
version_prefix = "v"
timestamp_layout = "20060102150405"

[params.build.theme]
revision = ""
dirty = false

[params.build.audit]
permalink_collision = "warn"

[frontmatter]
# Editorial update time: never derive it from repository maintenance.
lastmod = ["lastmod", "date"]

[module.hugoVersion]
min = "0.157.0"
